media:
  input: images
  output: /images

content:

  - name: posts
    label: Articles
    type: collection
    path: _articles

    filename: "{primary}.md"

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - News
            - Film
            - TV
            - Reviews
            - Box Office
            - Awards
            - Trailers
            - Features

      - name: language
        label: Language
        type: select
        required: true
        options:
          values:
            - en
            - fa

      - name: date
        label: Publish Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: summary
        label: Summary
        type: text
        required: true

      - name: people
        label: People
        type: string
        required: false
        description: Separate names with commas

      - name: image
        label: Featured Image
        type: image

      - name: body
        label: Article
        type: rich-text
        required: true


  - name: people
    label: People
    type: collection
    path: _people

    filename: "{primary}.md"

    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: language
        label: Language
        type: select
        required: true
        options:
          values:
            - en
            - fa

      - name: title
        label: SEO Title
        type: string
        required: true

      - name: description
        label: SEO Description
        type: text
        required: true

      - name: body
        label: Biography
        type: rich-text
        required: false

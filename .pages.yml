media:
  input: images
  output: /images

content:

  - name: posts
    label: Articles
    path: _articles
    type: collection

    fields:

      - name: title
        label: Title
        type: string
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - News
            - Film
            - TV
            - Reviews
            - Box Office
            - Awards
            - Trailers
            - Features

      - name: language
        label: Language
        type: select
        required: true
        options:
          values:
            - en
            - fa

      - name: date
        label: Publish Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updated
        label: Updated Date
        type: date
        required: false
        default: ""
        options:
          format: yyyy-MM-dd

      - name: summary
        label: Summary
        type: text
        required: true

      - name: people
        label: People
        type: string
        required: false
        description: Main people mentioned in the article, e.g. Asghar Farhadi, Taraneh Alidoosti

      - name: film
        label: Film
        type: string
        required: false
        description: Main film title in English

      - name: festival
        label: Festival
        type: string
        required: false
        description: Festival name, e.g. Cannes Film Festival

      - name: author
        label: Author
        type: string
        required: false
        default: CinemaDaily

      - name: image
        label: Featured Image
        type: image
        required: false

      - name: body
        label: Article
        type: rich-text
        required: true

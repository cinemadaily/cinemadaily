<!DOCTYPE html>

<html
    lang="{{ page.language | default: 'en' }}"
    {% if page.language == "fa" %}dir="rtl"{% endif %}
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- BASIC SEO -->

    <title>
        {{ page.title }} | CinemaDaily
    </title>


    <meta
        name="description"
        content="{{ page.summary | default: page.title | strip_html | escape }}"
    >

    <meta
        name="robots"
        content="index, follow, max-image-preview:large"
    >


    <link
        rel="canonical"
        href="{{ page.url | absolute_url }}"
    >


    <!-- FAVICON -->

    <link
        rel="icon"
        type="image/png"
        href="{{ '/images/favicon.png' | relative_url }}"
    >

    <link
        rel="apple-touch-icon"
        href="{{ '/images/favicon.png' | relative_url }}"
    >


    <!-- OPEN GRAPH -->

    <meta
        property="og:type"
        content="article"
    >

    <meta
        property="og:site_name"
        content="CinemaDaily"
    >

    <meta
        property="og:title"
        content="{{ page.title | escape }}"
    >

    <meta
        property="og:description"
        content="{{ page.summary | default: page.title | strip_html | escape }}"
    >

    <meta
        property="og:url"
        content="{{ page.url | absolute_url }}"
    >


    {% if page.image %}

    <meta
        property="og:image"
        content="{{ page.image | absolute_url }}"
    >

    <meta
        property="og:image:alt"
        content="{{ page.title | escape }}"
    >

    {% endif %}


    <!-- ARTICLE METADATA -->

    {% if page.date %}

    <meta
        property="article:published_time"
        content="{{ page.date | date_to_xmlschema }}"
    >

    {% endif %}


    {% if page.category %}

    <meta
        property="article:section"
        content="{{ page.category | escape }}"
    >

    {% endif %}


    <!-- X / TWITTER -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="{{ page.title | escape }}"
    >

    <meta
        name="twitter:description"
        content="{{ page.summary | default: page.title | strip_html | escape }}"
    >


    {% if page.image %}

    <meta
        name="twitter:image"
        content="{{ page.image | absolute_url }}"
    >

    {% endif %}


    <!-- STRUCTURED DATA -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "NewsArticle",

        "headline": {{ page.title | jsonify }},

        "description": {{ page.summary | default: page.title | strip_html | jsonify }},

        "url": {{ page.url | absolute_url | jsonify }},

        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": {{ page.url | absolute_url | jsonify }}
        },

        {% if page.image %}

        "image": [
            {{ page.image | absolute_url | jsonify }}
        ],

        {% endif %}

        {% if page.date %}

        "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
        "dateModified": {{ page.date | date_to_xmlschema | jsonify }},

        {% endif %}

        "publisher": {
            "@type": "Organization",
            "name": "CinemaDaily",
            "logo": {
                "@type": "ImageObject",
                "url": {{ '/images/logo2.jpeg' | absolute_url | jsonify }}
            }
        }
    }
    </script>


    <link
        rel="stylesheet"
        href="{{ '/style.css' | relative_url }}"
    >


    <!-- ARTICLE IMAGE FIX -->

    <style>

        /*
        Prevent desktop article images from being cropped.
        The original stylesheet applies max-height + object-fit: cover.
        This override keeps the complete source image visible.
        */

        .article-main-image {
            display: block;
            width: 100%;
            height: auto;
            max-height: none;
            object-fit: contain;
            object-position: center center;
            margin-bottom: 45px;
        }


        @media (max-width: 768px) {

            .article-main-image {
                width: 100%;
                height: auto;
                max-height: none;
                object-fit: contain;
            }

        }

    </style>

</head>

    {% if page.language == "fa" %}
        class="rtl-page"
    {% endif %}
>

    <div class="header-main">


        <div class="header-logo">
